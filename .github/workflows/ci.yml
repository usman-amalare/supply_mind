name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Put uv on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Backend checks
        run: make check
